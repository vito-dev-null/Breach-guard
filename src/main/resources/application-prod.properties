# Production Configuration Profile
# Use with: SPRING_PROFILES_ACTIVE=prod

# Database Configuration
spring.datasource.url=jdbc:h2:./data/breachguard;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console - DISABLED in production
spring.h2.console.enabled=false

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true

# Logging - Production level
logging.level.root=WARN
logging.level.com.example.monitoring=INFO
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# Security - MUST be set via environment variables in production
security.user.name=${SECURITY_USER_NAME:admin}
security.user.password=${SECURITY_USER_PASSWORD:changeme}
security.user.role=${SECURITY_USER_ROLE:ADMIN}

# Application name
spring.application.name=Breach Guard

# Actuator - disable in production or restrict access
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
