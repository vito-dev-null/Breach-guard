<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHub - Breach Embed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/game.css?v=12">
  </head>
  <body class="text-white bg-dark">
    <div class="container py-5">
      <div class="row mb-4">
        <div class="col-12 d-flex justify-content-between align-items-center">
          <h1 class="h3 text-accent">GitHub</h1>
          <form th:action="@{/github}" method="get" class="d-flex gap-2">
            <input name="email" type="email" class="form-control form-control-sm" placeholder="Inserisci email da verificare" required>
            <button class="btn btn-sm btn-accent">Mostra report</button>
          </form>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div th:if="${result != null}" th:insert="fragments/report-fragment :: reportCard(${result})"></div>
          <div th:unless="${result != null}" class="result-card p-4 text-slate-300">
            Inserisci un'email nel campo soprastante e clicca "Mostra report" per visualizzare i risultati qui.
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
